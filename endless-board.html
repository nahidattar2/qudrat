<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة تدريبات القدرات اللامنتهية</title>
<style>
@font-face{font-family:Cairo;src:url(fonts-Cairo.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:Cairo,"Geeza Pro",Tahoma,sans-serif;color:#2e1660;min-height:100vh;line-height:1.6;background:linear-gradient(180deg,#e6d8fb 0%,#f0e8fd 35%,#f9f5ff 100%)}
.page{max-width:1600px;margin:0 auto;padding:.6rem 1rem .4rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a,.top button{font:inherit;font-weight:bold;text-decoration:none;border:0;cursor:pointer;border-radius:12px;padding:.3rem .9rem;font-size:.9rem;background:#fff;color:#4a2a9c;box-shadow:0 3px 10px rgba(110,70,190,.18)}
h1{text-align:center;font-size:2.1rem;font-weight:900;color:#3a1c74;margin:.1rem 0 0}
.sub{text-align:center;font-size:1.1rem;font-weight:bold;color:#6a4bb0;margin-bottom:.4rem}
.tabs{display:flex;justify-content:center;gap:.6rem;margin:.2rem 0 .6rem;flex-wrap:wrap}
.tab{font:inherit;font-size:1.25rem;font-weight:bold;border:2px solid #b596f2;background:#fff;color:#4a2a9c;border-radius:.9rem;padding:.2rem 1.6rem;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#9b74e6,#6440b4);color:#fff;border-color:#6440b4}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.rc{background:rgba(255,255,255,.88);border-radius:1.2rem;padding:.5rem 1rem;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 24px rgba(110,70,190,.14)}
.rc h2{font-size:1.25rem;font-weight:900}.rc p{font-size:.95rem;color:#5b4a8a;font-weight:bold}
.ring{position:relative;width:5.4rem;height:5.4rem;flex:none}.ring svg{width:100%;height:100%}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.rt b{font-size:1.35rem}.rt small{font-size:.7rem;color:#6a5a99;font-weight:bold}
.big{font-size:2.2rem;font-weight:900;color:#4a2a9c;min-width:5.4rem;text-align:center}
.tbl{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:.7rem;padding:.5rem .9rem;border-radius:1.2rem;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(110,70,190,.12)}
.it{display:grid;grid-template-columns:2rem minmax(max-content,1.2fr) 1.6fr 3.6rem 3.4rem;align-items:center;gap:.6rem;padding:.22rem .3rem;border-bottom:1px solid #f0e9fa;font-size:1.15rem;font-weight:bold}
.it:nth-child(odd):not(.hd){background:#fbf8ff}.it.hd{color:#4a2a9c;border-bottom:2px solid #e3d8f2;font-size:1rem}.it.hd span{text-align:center}.it.hd span:nth-child(2){text-align:right}
.no{color:#8a78b8;text-align:center}.nm{white-space:nowrap}
.pc{display:flex;align-items:center;gap:.4rem}.bar{flex:1;height:.85rem;background:#ece5f6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#b596f2,#4a2a9c)}
.full .bar i{background:linear-gradient(90deg,#7ed6a5,#1f8a4c)}
.pl{font-size:.8rem;white-space:nowrap;min-width:4.6rem;text-align:center;border-radius:999px;padding:0 .4rem;background:#efe4ff;color:#5b2fa8}.full .pl{background:#1f8a4c;color:#fff}
.ac,.td{text-align:center;font-size:.95rem}.td{color:#6a5a99}
.empty{color:#6a5a99;text-align:center;padding:18px;font-size:1.1rem;grid-column:1/-1}
.note{text-align:center;color:#6a5a99;font-size:.8rem;margin-top:.4rem}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e6d8fb,#f9f5ff);z-index:9}
.lk{background:#fff;border-radius:26px;padding:28px 30px;text-align:center;box-shadow:0 12px 34px rgba(110,70,190,.25);width:min(420px,92vw)}
.lk h2{font-size:24px;margin:8px 0 14px}.lk input{font:inherit;font-size:30px;text-align:center;letter-spacing:.4em;width:100%;border:2px solid #cdb6f6;border-radius:14px;padding:8px;outline:0;direction:ltr}
.lk button{font:inherit;font-size:22px;font-weight:bold;margin-top:14px;width:100%;border:0;border-radius:14px;padding:10px;color:#fff;background:linear-gradient(180deg,#9b74e6,#6440b4);cursor:pointer}
.lk .er{color:#c2185b;font-weight:bold;min-height:1.6em;margin-top:6px}
@media(max-width:820px){.tbl,.rings{grid-template-columns:1fr}}
</style></head><body>
<div id="lock"><div class="lk"><div style="font-size:44px">🔒</div><h2>للمعلمة فقط — أدخلي الرقم السري</h2>
<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="unlock()">دخول</button><div class="er" id="er"></div></div></div>
<div class="page">
<div class="top"><a href="links.html">→ روابط القدرات</a><button onclick="load()">🔄 تحديث</button></div>
<h1>تقدّم الطالبات في تدريبات القدرات اللامنتهية ♾️</h1><div class="sub">عدد الإجابات الصحيحة لكل طالبة — يكتمل الشريط عند <span id="gl"></span> إجابة صحيحة</div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="empty">جارٍ تحميل النتائج…</div></div>
<div class="note">تتحدث النتائج من جدول «قاعدة بيانات صفحاتي» — ورقة «تدريب القدرات اللامنتهي».</div>
</div>
<script>
const PIN="1448";      // الرقم السري
const GOAL=30;         // عدد الإجابات الصحيحة لاكتمال الشريط
const API="https://script.google.com/macros/s/AKfycbzsP_TgAj852n0P5ocWo8rg08w5xNAkRzfRI90wo2dyhJKs-eWFqNWIQh3fhhBMtgZqwQ/exec";
const TAB="تدريب القدرات اللامنتهي";
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase();
const clsNum=c=>{const m=String(c).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).match(/\d/);return m?m[0]:""};
let CLS="1",ROWS=null;
document.getElementById("gl").textContent=AR(GOAL);
function unlock(){if(document.getElementById("pin").value===PIN){try{sessionStorage.setItem("qpin","1")}catch(e){}document.getElementById("lock").remove();load()}else document.getElementById("er").textContent="الرقم السري غير صحيح"}
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
try{if(sessionStorage.getItem("qpin")==="1"||/nahidattar2\.github\.io\/11\/links\.html/.test(document.referrer)){document.getElementById("lock").remove();setTimeout(load)}}catch(e){}
function load(){const cb="cb"+Math.random().toString(36).slice(2),s=document.createElement("script");
  const to=setTimeout(()=>{delete window[cb];s.remove();document.getElementById("app").innerHTML='<div class="empty">تعذّر تحميل النتائج — اضغطي «تحديث».</div>'},15000);
  window[cb]=d=>{clearTimeout(to);delete window[cb];s.remove();ROWS=d.rows||[];build()};
  s.src=API+"?tab="+encodeURIComponent(TAB)+"&callback="+cb+"&_="+Date.now();document.body.appendChild(s)}
function fit(){const r=document.documentElement;let f=19;r.style.fontSize=f+"px";
  while(f>8&&(document.body.scrollHeight>innerHeight+2||[...document.querySelectorAll(".it")].some(e=>e.scrollWidth>e.clientWidth+1))){f-=.5;r.style.fontSize=f+"px"}}
addEventListener("resize",()=>{if(ROWS)fit()});
function build(){
  const st={},today=new Date();today.setHours(0,0,0,0);
  ROWS.forEach(r=>{const n=String(r["اسم الطالبة"]||"").trim();if(n.length<3)return;const c=clsNum(r["الفصل"]),k=c+"|"+norm(n);
    const o=st[k]=st[k]||{n,c,ok:0,all:0,td:0};o.all++;if(String(r["النتيجة"]).includes("صحيح"))o.ok++;if(new Date(r["الوقت"])>=today)o.td++});
  document.getElementById("tabs").innerHTML=["1","2","3"].map(c=>`<button class="tab ${c===CLS?"on":""}" onclick="CLS='${c}';build()">أولى ${AR(c)}</button>`).join("");
  const L=Object.values(st).filter(s=>s.c===CLS).sort((a,b)=>b.ok-a.ok||a.n.localeCompare(b.n,"ar"));
  const n=L.length,done=L.filter(s=>s.ok>=GOAL).length,tot=L.reduce((a,s)=>a+s.ok,0),all=L.reduce((a,s)=>a+s.all,0);
  const p=n?Math.round(100*done/n):0,acc=all?Math.round(100*tot/all):0;
  const ring=(v,sub,id,c1,c2)=>{const r=42,C=2*Math.PI*r;return`<div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="50" cy="50" r="${r}" fill="none" stroke="#ece5f6" stroke-width="11"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#${id})" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 50 50)"/></svg><div class="rt"><b>${AR(v)}٪</b><small>${sub}</small></div></div>`};
  let h=`<div class="rings"><div class="rc">${ring(p,`${AR(done)} من ${AR(n)}`,"g1","#7ed6a5","#1f8a4c")}<div><h2>🏆 أكملن الهدف</h2><p>${AR(GOAL)} إجابة صحيحة فأكثر</p></div></div>
   <div class="rc"><div class="big">${AR(tot)}</div><div><h2>✅ إجابات صحيحة</h2><p>مجموع الفصل من ${AR(all)} محاولة</p></div></div>
   <div class="rc">${ring(acc,"الدقة","g2","#b596f2","#4a2a9c")}<div><h2>🎯 دقة الفصل</h2><p>نسبة الإجابات الصحيحة</p></div></div></div>`;
  const half=Math.ceil(n/2),head='<div class="it hd"><span>م</span><span>اسم الطالبة</span><span>الإجابات الصحيحة</span><span>الدقة</span><span>اليوم</span></div>';
  h+=`<div class="tbl">${n?[L.slice(0,half),L.slice(half)].map((cl,k)=>`<div>${head}${cl.map((s,i)=>{const v=Math.min(100,Math.round(100*s.ok/GOAL)),f=s.ok>=GOAL;
    return`<div class="it ${f?"full":""}"><span class="no">${AR(k*half+i+1)}</span><span class="nm">${esc(s.n)}</span><div class="pc"><div class="bar"><i style="width:${v}%"></i></div><span class="pl">${f?"🏆 ":""}${AR(s.ok)} من ${AR(GOAL)}</span></div><span class="ac">${AR(Math.round(100*s.ok/s.all))}٪</span><span class="td">${s.td?"+"+AR(s.td):"—"}</span></div>`}).join("")}</div>`).join(""):'<div class="empty">لم تبدأ طالبات هذا الفصل التدريب بعد</div>'}</div>`;
  document.getElementById("app").innerHTML=h;fit();
}
</script></body></html>

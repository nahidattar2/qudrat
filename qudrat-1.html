<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار القدرات الكمي ١ — الهندسة</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--tx:#241b3a;--mut:#6b6185;--pri:#5b2fb0;--pri2:#efe8fb;--ok:#1b8a4b;--okb:#e3f5ea;--bad:#c0392b;--badb:#fbe7e4;--bd:#ddd3ee;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14101e;--card:#1f1830;--tx:#efeaf8;--mut:#a99fc2;--pri:#b49af2;--pri2:#30264a;--ok:#4cc884;--okb:#173a28;--bad:#ff8577;--badb:#42201c;--bd:#3a2f55}}
:root[data-theme="dark"]{--bg:#14101e;--card:#1f1830;--tx:#efeaf8;--mut:#a99fc2;--pri:#b49af2;--pri2:#30264a;--ok:#4cc884;--okb:#173a28;--bad:#ff8577;--badb:#42201c;--bd:#3a2f55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Geeza Pro","GeezaPro","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh}
.w{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2rem 0;color:var(--pri);text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 4px}
.stats{display:flex;gap:8px;margin:16px 0}
.stats div{flex:1;background:var(--pri2);border-radius:12px;text-align:center;padding:10px 4px}
.stats b{display:block;font-size:1.4rem;color:var(--pri)}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:var(--pri2);color:var(--pri)}
button:disabled{opacity:.4;cursor:default}
.full{width:100%;margin-top:14px}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.timer{background:var(--pri2);color:var(--pri);padding:4px 14px;border-radius:20px;direction:ltr}
.timer.low{background:var(--badb);color:var(--bad)}
.bar{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:20px;background:var(--pri2);color:var(--pri);margin-bottom:8px}
.q{font-size:1.1rem;font-weight:700;margin:0 0 12px}
.hint{color:var(--mut);font-size:.9rem;margin:-6px 0 10px}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin-bottom:8px;font-weight:500}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--bad);background:var(--badb)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:12px}
.nav button{flex:1}
.score{text-align:center;font-size:2.6rem;font-weight:800;color:var(--pri);margin:0;direction:ltr}
.lvl{text-align:center;font-weight:700;margin:0 0 6px}
.ex{margin-top:8px;padding:10px;border-radius:10px;background:var(--pri2);font-size:.95rem}
.small{color:var(--mut);font-size:.85rem;text-align:center}
.cls{display:flex;gap:8px}.cls button{flex:1;background:var(--bg);color:var(--tx);border:2px solid var(--bd);font-size:1.2rem}.cls button.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.sent{text-align:center;font-size:.9rem;margin:6px 0 0}
.logo{display:block;background:#fff;border-radius:14px;padding:10px 14px;margin:0 auto 12px;max-width:300px}.logo img{display:block;width:100%;height:auto}
.ltr{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}
#wx{position:fixed;inset:0;background:rgba(20,12,40,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#wx.on{display:flex}
#wx .bx{background:var(--card);border-radius:18px;padding:24px;max-width:440px;text-align:center;border:3px solid var(--bad)}
#wx h3{margin:0 0 8px;color:var(--bad);font-size:1.4rem}#wx p{margin:0 0 16px;line-height:1.8}
#s1,#s2{-webkit-user-select:none;user-select:none}
.cmp{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 12px;border:2px solid var(--pri);border-radius:12px;overflow:hidden;text-align:center}
.cmp th{background:var(--pri);color:#fff;padding:8px}.cmp td{padding:12px 8px;font-weight:700;background:var(--pri2);width:50%}.cmp td+td,.cmp th+th{border-inline-start:2px solid var(--pri)}
.note{text-align:center;color:var(--mut);font-size:.8rem;margin:-6px 0 10px}
</style>
</head>

{tg:"المضلعات",q:'ما مجموع قياسات الزوايا الداخلية للشكل السداسي؟',

{tg:"المساحة والمحيط",q:'في الشكل، مربع طول ضلعه '+L('6')+'، ورُسم ربع دائرة مركزه أحد رؤوس المربع ونصف قطره طول الضلع. ما مساحة الجزء المظلل؟',

{tg:"المساحة والمحيط",q:'إذا زاد طول ضلع مربع بنسبة '+L('50%')+'، فبكم تزيد مساحته؟',
 o:[L('50%'),L('100%'),L('125%'),L('150%')],a:2,
 h:'إرشاد: افترضي أن طول الضلع '+L('10')+'.',
 e:'إذا كان الضلع '+L('10')+' فالمساحة '+L('100')+'. بعد الزيادة يصبح الضلع '+L('15')+' والمساحة '+L('225')+'، فالزيادة '+L('125')+' أي '+L('125%')+'.'},
{tg:"مقارنة",fx:1,q:'مستطيل مساحته '+L('24 cm²')+'، وأطوال أضلاعه أعداد صحيحة. قارني بين:',
 f:CMP('محيط المستطيل',L('20 cm')),
 o:CMPO,a:3,
 e:'الأبعاد قد تكون '+L('6 × 4')+' فالمحيط '+L('20')+'، أو '+L('8 × 3')+' فالمحيط '+L('22')+'، أو '+L('12 × 2')+' فالمحيط '+L('28')+'. المحيط غير محدد، إذن المعطيات غير كافية.'}
];
var N=Q.length,T=600,MAXX=2;
var Q0=Q;
var t0=0,ans=[],cur=0,left=T,iv=null,done=false,KEY="qudrat1-state",ORD=null,OPT=null,exits=0,lastX=0,why="";
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mk(){ORD=shuf(Q0.map(function(_,i){return i}));OPT=ORD.map(function(qi){var ix=Q0[qi].o.map(function(_,j){return j});return Q0[qi].fx?ix:shuf(ix)})}
function build(){Q=ORD.map(function(qi,k){var q=Q0[qi],oo=OPT[k];return{t:q.t,tg:q.tg,q:q.q,h:q.h,f:q.f,e:q.e,o:oo.map(function(j){return q.o[j]}),a:oo.indexOf(q.a),oi:qi}})}
function save(st,extra){try{var o={st:st,n:$("nm").value,c:$("cl").value,t0:t0,a:ans,cur:cur,ord:ORD,opt:OPT,x:exits,why:why};for(var k in extra)o[k]=extra[k];localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function getState(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function norm(x){return String(x||"").replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim()}
function already(name,cls,cb){
 if(!/^https:/.test(API))return cb(false);
 var fn="ck"+Date.now(),sc=document.createElement("script"),fin=false;
 function end(v){if(fin)return;fin=true;delete window[fn];sc.remove();cb(v)}
 var to=setTimeout(function(){end(false)},8000);
 window[fn]=function(d){clearTimeout(to);end((d.rows||[]).some(function(r){return String(r.cls)===String(cls)&&norm(r.name)===norm(name)}))};
 sc.onerror=function(){clearTimeout(to);end(false)};
 sc.src=API+"?quiz="+encodeURIComponent(QUIZ)+"&callback="+fn+"&_="+Date.now();
 document.body.appendChild(sc);
}
function $(i){return document.getElementById(i)}
function show(n){["s0","s1","s2"].forEach(function(s){$(s).className=(s==n?"":"hide")+(s=="s0"?" card":"")})}
/* ملء الشاشة */
var DE=document.documentElement;
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function fsOK(){return !!(DE.requestFullscreen||DE.webkitRequestFullscreen)}
function reqFs(){try{var p=(DE.requestFullscreen||DE.webkitRequestFullscreen).call(DE);if(p&&p.catch)p.catch(function(){})}catch(e){}}
function exitFs(){try{if(isFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
/* رصد الخروج */
function running(){return !done&&$("s1").className.indexOf("hide")<0}
function leave(){
 if(!running())return;
 var now=Date.now();if(now-lastX<1500)return;lastX=now;
 exits++;save("run");
 if(exits>=MAXX){why="exit";$("wx").className="";finish(true);return}
 warn("⚠️ خرجتِ من صفحة الاختبار","هذا الخروج الأول. إذا خرجتِ مرة ثانية يُسلَّم الاختبار تلقائيًا، وتظهر مرات الخروج للمعلمة.");
}
function warn(t,m){$("wxt").textContent=t;$("wxm").textContent=m;$("wx").className="on"}
$("wxb").onclick=function(){$("wx").className="";if(fsOK()&&!isFs())reqFs()};
document.addEventListener("visibilitychange",function(){if(document.hidden)leave()});
window.addEventListener("blur",function(){setTimeout(function(){if(!document.hasFocus())leave()},300)});
function onFs(){if(!isFs()&&running()&&fsOK())leave()}
document.addEventListener("fullscreenchange",onFs);document.addEventListener("webkitfullscreenchange",onFs);
/* منع النسخ */
["copy","cut","contextmenu","selectstart","dragstart"].forEach(function(ev){document.addEventListener(ev,function(e){if(!/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||""))e.preventDefault()})});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&/^[acpsux]$/i.test(e.key)&&!/INPUT/.test(e.target.tagName))e.preventDefault()});
function render(){
 var q=Q[cur];
 $("cnt").textContent="السؤال "+(cur+1)+" من "+N;
 $("pg").style.width=((cur+1)/N*100)+"%";
 $("tg").textContent=q.tg||"";
 $("qt").innerHTML=q.q;
 $("hn").innerHTML=q.h||"";$("hn").style.display=q.h?"block":"none";
 $("fg").innerHTML=q.f||"";
 var h="";
 q.o.forEach(function(o,i){h+='<button class="opt'+(ans[cur]===i?" sel":"")+'" data-i="'+i+'">'+"أبجد"[i]+") "+o+"</button>"});
 $("ops").innerHTML=h;
 $("pv").disabled=cur==0;
 $("nx").textContent=cur==N-1?"تسليم الاختبار":"التالي";
}
function tick(){
 var m=Math.floor(left/60),s=left%60;
 $("tm").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
 $("tm").className="timer"+(left<=60?" low":"");
 if(left<=0){finish(true);return}
 left--;
}
function marks(){return Q0.map(function(_,oi){for(var k=0;k<Q.length;k++)if(Q[k].oi===oi)return ans[k]===Q[k].a?1:0;return 0})}
function send(sc){
 var el=$("snt");
 if(!/^https:/.test(API)){el.textContent="";return}
 el.textContent="جارٍ إرسال الدرجة…";
 var body=JSON.stringify({quiz:QUIZ,name:$("nm").value.trim(),cls:$("cl").value,score:sc,total:N,secs:Math.round((Date.now()-t0)/1000),marks:marks(),exits:exits});
 fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
  .then(function(){el.textContent="✓ تم إرسال درجتك للمعلمة";el.style.color="var(--ok)"})
  .catch(function(){el.textContent="تعذّر الإرسال، أخبري المعلمة";el.style.color="var(--bad)"});
}
$("clw").onclick=function(e){var b=e.target.closest("button");if(!b)return;$("cl").value=b.getAttribute("data-c");$("clw").style.outline="";[].forEach.call($("clw").children,function(x){x.className=x===b?"on":""})};
function finish(auto,restored){
 if(done)return;
 var ml=[];ans.forEach(function(x,i){if(x===null)ml.push(i+1)});
 if(!auto&&!restored&&ml.length&&!confirm("⚠️ تنبيه: لا يوجد حل "+(ml.length>1?"للأسئلة رقم ":"للسؤال رقم ")+ml.join(" و ")+".\nهل تريدين التسليم دون حله؟\n(إلغاء = العودة إلى أول سؤال بدون حل)")){cur=ml[0]-1;render();return}
 done=true;clearInterval(iv);$("wx").className="";
 var sc=0,h="";
 Q.forEach(function(q,i){
  var ok=ans[i]===q.a;if(ok)sc++;
  h+='<div class="card"><span class="tag">سؤال '+(i+1)+(ok?" ✓":" ✗")+'</span><p class="q">'+q.q+'</p>'+(q.f||"");
  q.o.forEach(function(o,j){
   var c="opt";if(j==q.a)c+=" ok";else if(j==ans[i])c+=" no";
   h+='<div class="'+c+'" style="padding:10px;border-radius:12px;margin-bottom:6px">'+"أبجد"[j]+") "+o+"</div>";
  });
  if(ans[i]===null)h+='<p class="small">لم تتم الإجابة عن هذا السؤال.</p>';
  h+='<div class="ex">'+q.e+"</div></div>";
 });
 $("rv").innerHTML=h;
 $("sc").textContent=sc+" / "+N;
 $("who").textContent=($("nm").value||"")+($("cl").value?" — الفصل "+$("cl").value:"");
 $("lv").textContent=sc==N?"ممتازة! إتقان تام 🌟":sc>=N*0.8?"مستوى جيد جدًا":sc>=N*0.6?"مستوى جيد، راجعي الأسئلة الخاطئة":"تحتاجين إلى مراجعة دروس الهندسة";
 $("bk").textContent=(why=="exit"?"تم التسليم تلقائيًا بسبب الخروج من صفحة الاختبار مرتين. ":auto?"انتهى الوقت وتم التسليم تلقائيًا. ":"")+"تم تسليم الاختبار، ولا يمكن إعادته.";
 if(!restored){send(sc);save("done",{s:sc,auto:!!auto})}
 exitFs();
 show("s2");window.scrollTo(0,0);
}
$("go").onclick=function(){
 if(!$("nm").value.trim()){$("nm").focus();$("nm").style.borderColor="var(--bad)";return}
 if(!$("cl").value){$("clw").style.outline="2px solid var(--bad)";return}
 if(getState()){location.reload();return}
 if(fsOK())reqFs();
 var go=$("go");go.disabled=true;go.textContent="جارٍ التحقق…";$("msg").textContent="";
 already($("nm").value,$("cl").value,function(dup){
  go.disabled=false;go.textContent="ابدئي الاختبار";
  if(dup){exitFs();$("msg").textContent="سبق أن أدّيتِ هذا الاختبار، ولا يُسمح بإعادته.";return}
  t0=Date.now();mk();build();exits=0;why="";
  ans=Q.map(function(){return null});cur=0;left=T;done=false;
  save("run");
  show("s1");render();tick();iv=setInterval(tick,1000);
 });
};
(function(){
 var st=getState();if(!st)return;
 $("nm").value=st.n||"";$("cl").value=st.c||"";t0=st.t0;cur=st.cur||0;exits=st.x||0;why=st.why||"";
 if(st.ord&&st.opt){ORD=st.ord;OPT=st.opt}else mk();build();
 ans=st.a||Q.map(function(){return null});
 if(st.st=="done"){finish(st.auto,true);return}
 left=T-Math.floor((Date.now()-t0)/1000);
 if(left<=0){left=0;finish(true);return}
 show("s1");render();tick();iv=setInterval(tick,1000);
 if(exits>=MAXX){why="exit";finish(true);return}
 warn("تم إعادة فتح الاختبار","مرات الخروج حتى الآن: "+exits+" من "+MAXX+". اضغطي للمتابعة.");
})();
$("ops").onclick=function(e){
 var b=e.target.closest(".opt");if(!b)return;
 ans[cur]=+b.getAttribute("data-i");save("run");render();
};
$("pv").onclick=function(){if(cur>0){cur--;save("run");render()}};
$("nx").onclick=function(){if(cur<N-1){cur++;save("run");render()}else finish(false)};
</script>
</body>
